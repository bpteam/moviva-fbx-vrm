name: build

# Pull request: tests, build and smoke test on Linux, Windows and macOS (the binaries are kept as run artifacts).
# Merge to master: the same, then a GitHub release v<version>.<run number> with the three archives.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the release job creates the tag and uploads the binaries

concurrency:  # a newer push to the same PR cancels the older run; master runs never cancel each other
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # oldest glibc the bpy wheel (manylinux_2_28) accepts that GitHub still offers
            artifact: moviva-fbx-to-vrm-linux-x64.tar.gz
          - os: windows-latest
            artifact: moviva-fbx-to-vrm-windows-x64.zip
          - os: macos-15  # Apple Silicon; there is no Intel-mac bpy wheel (macos-14 images retire Nov 2026)
            artifact: moviva-fbx-to-vrm-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries Blender and Qt need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 \
            libegl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fetch the VRM Add-on (pinned, checksum-verified)
        run: python packaging/fetch_addon.py
      - name: Fetch Autorig Workbench and Mesh2Motion's human skeleton (pinned, checksum-verified)
        run: python packaging/fetch_autorig.py
      - name: MediaPipe (no OpenCV / matplotlib) and its face model (pinned, checksum-verified)
        shell: bash
        run: |
          python -m pip install --no-deps mediapipe==1.2.0 absl-py flatbuffers certifi
          python packaging/fetch_mediapipe.py
      - name: Tests
        shell: bash
        # character_vrm reads its sources without an encoding (cp1252 on Windows), and its launcher test expects
        # POSIX execute bits; the app never uses that launcher (Blender is in-process).
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pytest -q --deselect character_vrm/tests/unit/test_cli.py::test_resolution_errors
          else
            python -m pytest -q
          fi
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
      - name: Real Blender integration tests (auto-rig through the converter, real importers and exporter)
        run: python -m pytest -q character_vrm/tests/integration
        env:
          PYTHONUTF8: "1"
      - name: Build
        run: pyinstaller packaging/moviva-fbx-to-vrm.spec --noconfirm --workpath .pyi-work --distpath dist

      - name: Real-model smoke test of the built app (unrigged model -> rigged VRM)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          case "$RUNNER_OS" in
            Linux) exe=dist/moviva-fbx-to-vrm/moviva-fbx-to-vrm ;;
            macOS) exe=dist/moviva-fbx-to-vrm.app/Contents/MacOS/moviva-fbx-to-vrm ;;
            Windows) exe=dist/moviva-fbx-to-vrm/moviva-fbx-to-vrm.exe ;;
          esac
          python packaging/smoke_convert.py "$exe"
      - name: Distribution size report
        shell: bash
        run: |
          python - <<'PY'
          import os
          total = sum(os.path.getsize(os.path.join(d, f)) for d, _, fs in os.walk("dist") for f in fs)
          print(f"unpacked distribution: {total / 1e6:.1f} MB")
          assert not [f for d, _, fs in os.walk("dist") for f in fs if f.endswith((".ckpt", ".safetensors", ".pth"))], \
              "model weights must not ship in the default build"
          PY
      - name: Smoke test and package (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/moviva-fbx-to-vrm/moviva-fbx-to-vrm doctor
          tar -C dist -czf "${{ matrix.artifact }}" moviva-fbx-to-vrm
      - name: Smoke test and package (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/moviva-fbx-to-vrm.app/Contents/MacOS/moviva-fbx-to-vrm doctor
          python packaging/check_macos_min.py dist/moviva-fbx-to-vrm.app 14.0
          ditto -c -k --keepParent dist/moviva-fbx-to-vrm.app "${{ matrix.artifact }}"
      - name: Smoke test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/moviva-fbx-to-vrm/moviva-fbx-to-vrm.exe -ArgumentList "doctor" `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput doctor.txt -RedirectStandardError doctor-err.txt
          Get-Content doctor.txt, doctor-err.txt
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Compress-Archive -Path dist/moviva-fbx-to-vrm -DestinationPath "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          compression-level: 0  # already compressed
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build  # all three systems must pass, or nothing is released
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="v${version}.${{ github.run_number }}"
          gh release create "$tag" out/* --target "${{ github.sha }}" --title "Moviva FBX to VRM $tag" \
            --generate-notes --latest
